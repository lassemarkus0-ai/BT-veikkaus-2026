<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT-VEIKKAUS 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            background-color: #111;
            color: #ffcc00;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .header p {
            margin: 5px 0 0 0;
            color: #fff;
        }
        .section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .section h2 {
            margin-top: 0;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 8px;
        }
        .rules {
            background-color: #fffde7;
            border-left: 4px solid #ffcc00;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .match-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }
        .match-card h3 {
            margin: 0 0 10px 0;
            color: #111;
        }
        .predictions ul {
            list-style-type: none;
            padding-left: 0;
            margin: 5px 0 0 0;
        }
        .predictions li {
            display: inline-block;
            background: #e9ecef;
            padding: 4px 10px;
            margin-right: 8px;
            margin-top: 5px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>BT-VEIKKAUS 2026</h1>
        <p>Kärppien runkosarjaotteluiden veikkauskimppa</p>
    </div>

    <div class="section">
        <h2>Sarjataulukko</h2>
        <div id="standings-container">Ladataan sarjataulukkoa...</div>
    </div>

    <div class="section">
        <h2>Otteluhistoria ja Kerroinlaskenta</h2>
        <div class="rules">
            <strong>Pistelaskusäännöt:</strong><br>
            Eniten veikattu merkki = <strong>1 p</strong> | Vähiten veikattu merkki = <strong>2 p</strong> | Tasavertaiset veikkaukset = <strong>1,5 p</strong>
        </div>

        <!-- Tähän säiliöön script.js tulostaa pelatut ja tulevat ottelut -->
        <div id="matches-container">Ladataan otteluita...</div>
    </div>

    <!-- Kytkentä script.js-tiedostoon -->
    <script src="script.js"></script>
</body>
</html>
