<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <!-- Mobiilinäytön optimointi -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT-veikkaus 2026</title>
  
  <style>
    /* Yleiset perustyylit */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f6f8;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #1a2b4c;
      margin-bottom: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Taulukon tyylit */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #e0e0e0;
      padding: 10px 12px;
      text-align: center;
    }

    th {
      background-color: #1a2b4c;
      color: #ffffff;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background-color: #f9fafb;
    }

    /* Mobiilimukautukset (puhelimen näytölle) */
    @media (max-width: 768px) {
      body {
        padding: 8px;
        font-size: 14px;
      }

      .container {
        padding: 12px;
      }

      h1 {
        font-size: 1.4rem;
        margin-bottom: 12px;
      }

      table {
        white-space: nowrap;
      }

      th, td {
        padding: 8px 6px;
        font-size: 13px;
      }

      button, select {
        width: 100%;
        min-height: 44px;
        margin-bottom: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>BT-veikkaus 2026</h1>
    
    <div class="table-wrapper">
      <table id="matchTable">
        <!-- Taulukon sisältö renderöidään script.js-tiedostosta -->
      </table>
    </div>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>
