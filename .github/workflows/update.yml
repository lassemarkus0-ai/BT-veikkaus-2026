name: Automatisoitu tulospäivitys

on:
  schedule:
    # Ajaa 15 min välein klo 12:00–19:00 UTC (noin klo 15:00–22:00 Suomen aikaa)
    - cron: '*/15 12-19 * * *'
  workflow_dispatch: # Mahdollistaa käynnistyksen myös käsin

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hae koodi repositoriosta
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Asenna tarvittavat paketit
        run: pip install requests

      - name: Suorita päivitysskripti
        run: python update_results.py

      - name: Tallenna ja pushaa muutokset repositorioon
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Live-tulospäivitys API:sta" || exit 0
          git push
